name: main
on:
  - pull_request
  - push
permissions:
  contents: read
jobs:
  main:
    name: Spell Check and Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/jod
      - run: npm install
      - run: npm test
